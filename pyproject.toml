[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "breachpoint"
version = "0.1.0"
description = "Knowledge document graph — incremental LLM-driven relationship discovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "anthropic>=0.25.0",
    "graspologic>=3.0",
    "rdflib>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
watch = ["watchdog>=4.0"]
serve = ["mcp>=1.0"]
export = ["matplotlib>=3.8"]
all = ["watchdog>=4.0", "mcp>=1.0", "matplotlib>=3.8"]

[project.scripts]
breachpoint = "breachpoint.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["breachpoint"]

[tool.setuptools.packages.find]
include = ["breachpoint*"]
